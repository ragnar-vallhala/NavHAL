# HIL board definition — ATmega328P (AVR), e.g. an Arduino Uno / clone.
# Read by `ntest hil atmega328p`. Unlike the ST-Link boards this one flashes
# with avrdude over the on-board USB-serial bridge; there is no chip-id probe,
# so the board is matched by that bridge's USB vendor id (below).

ARCH=avr
TOOLCHAIN_FILE=cmake/toolchains/avr-toolchain.cmake
BUILD_DIR=build-hil-avr
DEFCONFIG=cmake/defconfigs/avr_atmega328p.defconfig

# Device + programmer for avrdude. `arduino` drives the stk500 bootloader over
# the USB-serial link (Uno/clone). Use `usbasp`/`stk500v1`/etc. for a bare chip.
MCU=atmega328p
PROGRAMMER=arduino

# The AVR analogue of CHIPID: match the board by the USB idVendor of its
# serial bridge instead of a hard-coded /dev path. CH340 (1a86, common on
# clones), FT232 (0403), official Uno (2341). Set PORT= to pin an exact device.
USB_VID=1a86,0403,2341
# PORT=/dev/ttyUSB0

# Bootloader upload baud, then the navtest console baud (tests/main.c inits the
# UART at 9600). The board auto-resets on DTR, so capture restarts the program.
UPLOAD_BAUD=115200
BAUD=9600
# An ATmega at 16 MHz reporting 64 tests over a 9600-baud console is simply
# slower than the Cortex boards; this is wall-clock, not a hang budget.
TIMEOUT=180

# Opt-in caps worth exercising on real silicon. The reset suite reads MCUSR,
# which no emulator models faithfully, and the watchdog suite checks the step
# table the AVR's fixed WDP intervals produce. Neither arms a watchdog — see
# tests/cap/watchdog/test_watchdog.c for why that would be a bad idea here.
TEST_EXTRA_CONFIG="CONFIG_DRV_RESET=y CONFIG_DRV_WATCHDOG=y"
