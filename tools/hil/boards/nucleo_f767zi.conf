# HIL board definition — Nucleo-F767ZI (Cortex-M7 / STM32F7).
# Sourced as shell by tools/hil/run.sh. Variables are required unless
# marked optional.

ARCH=cortex-m7
TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-f767-toolchain.cmake
BUILD_DIR=build-hil-f767
DEFCONFIG=cmake/defconfigs/cortex-m7_stm32f7_nucleo_f767zi.defconfig

# STM32 device id (from `st-info --probe`, field "chipid"). run.sh matches the
# board to a connected ST-Link by this — stable across board instances, unlike
# the per-probe serial. 0x451 = STM32F76x/F77x.
CHIPID=0x451

# Console: USART3 is the ST-LINK Virtual COM Port on the Nucleo-144. run.sh
# finds the ttyACM that belongs to the matched ST-Link automatically.
BAUD=9600
FLASH_ADDR=0x08000000
TIMEOUT=120

# Opt-in caps to exercise on silicon that emulation can't fully validate:
# the compute/core drivers (FPU, DWT cycle counter, DMA, MPU) plus the M7 L1
# instruction cache (DRV_CACHE — M7-only). I2C + its DMA backend validate the
# I2C->DMA request path against a BME280 on I2C1 (PB8/PB9); the case pass-skips
# if no sensor is wired. SDIO is left off — the Nucleo has no card slot, and its
# block test is PIL-only anyway.
# DRV_RESET + BOOT_SNIFFER: the boot suite checks that the boot block lands
# outside the region startup zeroes, which is a property of this board's
# linker script and so is only really answered on the board. It never calls
# hal_boot_request, which would reset the part mid-run.
TEST_EXTRA_CONFIG="CONFIG_USE_FPU=y CONFIG_DRV_FPU=y CONFIG_DRV_DWT=y CONFIG_DRV_DMA=y CONFIG_DRV_MPU=y CONFIG_DRV_CACHE=y CONFIG_USE_TCM=y CONFIG_DRV_I2C=y CONFIG_DRV_I2C_DMA=y CONFIG_DRV_ETH=y CONFIG_DRV_ADC=y CONFIG_DRV_RESET=y CONFIG_BOOT_SNIFFER=y"
