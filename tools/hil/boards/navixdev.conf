# HIL board definition — NAVIXDEV (flight controller v0.0.3) (Cortex-M4 / STM32F4).
# Sourced as shell by tools/hil/run.sh. Variables are required unless
# marked optional.

ARCH=cortex-m4
TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-toolchain.cmake
BUILD_DIR=build-hil-navixdev
DEFCONFIG=cmake/defconfigs/cortex-m4_stm32f4_navixdev.defconfig

# 0x433 = STM32F401xD/xE — the same part the Nucleo carries, so a probe match
# is not a board match. The two confs are told apart by CONSOLE below: only the
# Nucleo's ST-LINK/V2-1 brings a virtual COM port with it.
CHIPID=0x433

# The debug probe is a bare ST-LINK/V2 with no VCP, and this revision has no USB
# device port, so the suite is driven over SWD — see _swd_capture in tools/ntest.
# USART2 does come out on the UART1 header (3V3 / GND / PA2 TX / PA3 RX), so a
# USB-serial adapter there is the faster console when one is to hand.
CONSOLE=swd
OPENOCD_ARGS="-f interface/stlink.cfg -f target/stm32f4x.cfg"
FLASH_ADDR=0x08000000
# Every console string costs a breakpoint round-trip over SWD, so the whole
# suite takes minutes rather than the seconds a UART capture needs.
TIMEOUT=600

# What this board has that the Nucleo does not: a 32.768 kHz crystal (Y1) for
# the RTC. USB is *not* routed on this revision -- PA12 goes nowhere and PA11
# is a PWM header pin -- so DRV_USB_CDC is deliberately absent. DRV_MPU matches
# the Nucleo's HIL set so the two boards' results stay comparable.
TEST_EXTRA_CONFIG="CONFIG_DRV_RTC=y CONFIG_DRV_MPU=y CONFIG_USE_FPU=y CONFIG_DRV_FPU=y CONFIG_DRV_DWT=y CONFIG_DRV_DMA=y CONFIG_DRV_RESET=y CONFIG_DRV_WATCHDOG=y CONFIG_DRV_WWDG=y"
