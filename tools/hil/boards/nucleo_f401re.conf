# HIL board definition — Nucleo-F401RE (Cortex-M4 / STM32F4).
# Sourced as shell by tools/hil/run.sh. Variables are required unless
# marked optional.

ARCH=cortex-m4
TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-toolchain.cmake
BUILD_DIR=build-hil-f401
DEFCONFIG=cmake/defconfigs/cortex-m4_stm32f4_nucleo_f401re.defconfig

# STM32 device id (from `st-info --probe`, field "chipid"). run.sh matches the
# board to a connected ST-Link by this — stable across board instances, unlike
# the per-probe serial. 0x433 = STM32F401xD/xE.
CHIPID=0x433

# Console: USART2 is the ST-LINK Virtual COM Port on the Nucleo-64. run.sh
# finds the ttyACM that belongs to the matched ST-Link automatically.
BAUD=9600
FLASH_ADDR=0x08000000
TIMEOUT=120

# Opt-in caps to exercise on silicon that emulation can't fully validate:
# the compute/core drivers (FPU, DWT cycle counter, DMA, MPU). SDIO is left
# off — the Nucleo has no card slot.
# DRV_RESET + BOOT_SNIFFER: the boot suite checks that the boot block lands
# outside the region startup zeroes, which is a property of this board's
# linker script and so is only really answered on the board. It never calls
# hal_boot_request, which would reset the part mid-run.
TEST_EXTRA_CONFIG="CONFIG_USE_FPU=y CONFIG_DRV_FPU=y CONFIG_DRV_DWT=y CONFIG_DRV_DMA=y CONFIG_DRV_MPU=y CONFIG_DRV_ADC=y CONFIG_DRV_RESET=y CONFIG_BOOT_SNIFFER=y"
