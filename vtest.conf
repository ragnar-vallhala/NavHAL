# NavHAL's test suites, for vtest. See docs/testing/vtest.md.
#
# The host suites go through vtest's ctest adapter, so each binary shows as its
# own case and builds alone when selected. Every other tier is a `check`: one
# command, one verdict, its exit status the result -- and 77 is SKIP, which is
# how a HIL board that is not plugged in reports.

# SIL: the host suites registered with ctest (tests_host, tests_host_drivers).
[host]
adapter   = ctest
dir       = build-host
configure = cmake -S tests/host -B build-host
open      = 1

# tests_host under ASan + UBSan: a differently configured build dir, not a
# different suite. Catches use-after-free, out-of-bounds and signed overflow in
# the conversion helpers, the CRC table and the GPIO pin encoding, which the
# plain build cannot see. Required on stable, and it never runs on main.
#
# tests_host_drivers is filtered out, not forgotten: it mmaps the real
# peripheral addresses so the drivers run unmodified, and the ARMv7-M System
# Control Space at 0xE000E000 sits inside ASan's shadow gap -- the suite aborts
# in its own setup before a single case runs. The two are not reconcilable
# without giving up fixed-address MMIO, so the sanitizer job in release-gate.yml
# runs tests_host alone too.
[host-asan]
adapter   = ctest
dir       = build-host-san
filter    = ^tests_host$
configure = cmake -S tests/host -B build-host-san -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

# CI gates.
[cap-contract]
adapter = check
cmd     = tools/test_cap_contract.sh

[coverage]
adapter = check
cmd     = tools/coverage.sh

# CodeQL security-and-quality over every arch's build, exactly as
# .github/workflows/codeql.yml runs them. 77 (SKIP) when the CLI is absent --
# the bundle is a ~1.4 GB optional install.
#
# Slow -- minutes per target, because a traced build cannot be incremental --
# and it runs all four anyway: no NavHAL build compiles the tree, so `m4` alone
# never sees the STM32F7 vendor tree, src/arch/avr or src/arch/x86_64, and a
# one-target pass would be a false all-clear for the rest. Findings do not fail
# the suite; the triage lives in GitHub's Security tab.
#
# Like the PIL suites it builds through the tree's .config, and stashes and
# restores the one already there.
[codeql]
adapter = check
cmd     = tools/run_codeql.sh all

# The port contract: every public entry point either has a conformance case or
# a declared reason it cannot, and every ops table has a completeness case.
[conformance-gate]
adapter = check
cmd     = tools/conformance_coverage.py --gate

[samples-m4]
adapter = check
cmd     = tools/samples.sh m4

[samples-m7]
adapter = check
cmd     = tools/samples.sh m7

[samples-avr]
adapter = check
cmd     = tools/samples.sh avr

# PIL: one suite per board in tools/pil/boards/, run in its emulator.
[pil-nucleo_f401re]
adapter = check
cmd     = tools/pil/run.sh nucleo_f401re

[pil-nucleo_f767zi]
adapter = check
cmd     = tools/pil/run.sh nucleo_f767zi

[pil-atmega328p]
adapter = check
cmd     = tools/pil/run.sh atmega328p

# HIL: one suite per board in tools/hil/boards/. A board that is not attached
# exits 77 and shows as SKIP, so a bench carrying two of these five is not a
# report with three failures in it.
[hil-nucleo_f401re]
adapter = check
cmd     = tools/hil/run.sh nucleo_f401re

[hil-nucleo_f767zi]
adapter = check
cmd     = tools/hil/run.sh nucleo_f767zi

[hil-navixdev]
adapter = check
cmd     = tools/hil/run.sh navixdev

[hil-navixsmf401re]
adapter = check
cmd     = tools/hil/run.sh navixsmf401re

[hil-atmega328p]
adapter = check
cmd     = tools/hil/run.sh atmega328p

[loc]
adapter = check
cmd     = vtest-loc src include tests tools utils samples
